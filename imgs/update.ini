[env]
swupdate_reset_env = y
[uboot]
swupdate_fip_flag = y
fit_name = boot.bin
spinandparts = mtdparts=spi0.0:896K(boot.A),896K(boot.B),256K(env),5M(kernel.A),5M(kernel.B),45M(rootfs.A),45M(rootfs.B),20M(config)
[kernel]
swupdate_kernel_flag = y
kernel_name = kernel.bin
[rootfs]
swupdate_rootfs_flag = y
rootfs_name = rootfs.bin
rootfs_mtd_size = 0x2D00000
rootfs_mtd_2 = 0x3900000


